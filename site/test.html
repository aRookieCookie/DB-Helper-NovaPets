<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <style>
        body{display: flex; justify-content: center; align-items: center; min-height: 100vh;}

        .cube{
            height: 200px;
            min-height: 500px;

            background: red;

            transition: min-height 1s ease-in-out;
        }

        .cube:hover{
            height: auto;
            min-height: 100px;



            background: blue;
        }

        .wrapper{
            display: flex; justify-content: center; align-items: center; height: 300px; width: 300px; border: 1px solid black;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="cube">letsgooo</div>
    </div>
</body>
</html>
